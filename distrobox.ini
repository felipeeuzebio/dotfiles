[arch-dev]
image=archlinux:latest
pull=true
replace=true
# Install base-devel via the native 'packages' directive
packages="base-devel git"
# Use init_hooks to build Paru as the non-root user
init_hooks="if ! command -v paru > /dev/null; then \
    printf '\033[0;34mBuilding Paru...\033[0m\n' && \
    cd /tmp && git clone https://aur.archlinux.org/paru.git && \
    cd paru && makepkg -si --noconfirm && \
    cd .. && rm -rf paru; \
    fi"
